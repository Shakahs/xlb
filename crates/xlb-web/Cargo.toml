[package]
name = "xlb-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "xlb browser storage tier: an Origin Private File System BlobStore under xlb-core's retention policy. wasm32-only in practice."

[dependencies]
xlb-core = { path = "../xlb-core", version = "0.8.47" }

# Everything browser-facing is wasm32-only so `cargo build` at the workspace
# root stays green on native hosts (this crate is then just a re-export).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemWritableFileStream",
    "Navigator",
    "StorageManager",
    "WritableStream",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
