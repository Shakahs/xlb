[package]
name = "xlb"
version = "0.8.51"
edition = "2021"
authors = ["yah Dev <human@yah.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/yah-ai/xlb"
description = "BLAKE3-verified blob distribution to plain files: local cache, iroh-blobs peers, ranged HTTP origin"
readme = "README.md"
keywords = ["p2p", "content-addressed", "blob", "blake3", "iroh"]
categories = ["network-programming", "caching"]

[lib]
name = "xlb"
path = "src/lib.rs"

# The supported build is Bazel, against the pinned crate universe of the
# enclosing repository. These requirements mirror what that universe provides.
[dependencies]
xlb-core = { path = "../xlb-core", version = "0.8.51" }
bao-tree = { version = "0.17", default-features = false }
bytes = "1"
futures = "0.3"
hex = "0.4"
iroh = { version = "1.4", default-features = false, features = ["tls-aws-lc-rs"] }
iroh-blobs = { version = "0.105", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "0.103", default-features = false, features = ["net"] }
iroh-smol-kv = { version = "0.5", default-features = false }
libc = "0.2"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["limit", "util"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
