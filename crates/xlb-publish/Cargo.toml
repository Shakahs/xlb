[package]
name = "xlb-publish"
version = "0.8.51"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
bao-tree = { version = "0.17", default-features = false }
blake3 = "1"
bytes = "1"
flate2 = "1"
futures = "0.3"
opendal = { version = "0.59", default-features = false }
ruzstd = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "sync"] }
tokio-util = { version = "0.7", features = ["io-util"] }
tracing = "0.1"
xlb-core = { path = "../xlb-core" }

[[bin]]
name = "convert_image_digests"
path = "tools/convert_image_digests.rs"
