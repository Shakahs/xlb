[package]
name = "xlb-mount"
version = "0.8.51"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
bytes = "1"
containerd-snapshots = { git = "https://github.com/containerd/rust-extensions", rev = "71584ba988d38c5e5e2147d703071543a9dc182e" }
fuser = { version = "=0.18.0", default-features = false }
futures = "0.3"
libc = "0.2"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "net", "rt-multi-thread", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-uring = { version = "0.5", features = ["bytes"] }
tonic = { version = "0.14", default-features = false, features = ["router", "server"] }
tracing = "0.1"
xlb = { path = "../xlb" }
xlb-core = { path = "../xlb-core" }
