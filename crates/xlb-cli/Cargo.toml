[package]
name = "xlb-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "xlb CLI — serve a node, inspect state, trigger fetches, manage peers and pinned trees"
publish = false

[[bin]]
name = "xlb"
path = "src/main.rs"

[dependencies]
blake3 = "1"
xlb     = { path = "../xlb" }
xlb-client = { path = "../xlb-client" }
xlb-core = { path = "../xlb-core" }
xlb-mount = { path = "../xlb-mount" }
axum    = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
futures = "0.3"
tokio   = { version = "1", features = ["fs", "macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", features = ["limit", "util"] }
rand = "0.10"
serde   = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow  = "1"
libc    = "0.2"

[dev-dependencies]
tempfile = "3"
